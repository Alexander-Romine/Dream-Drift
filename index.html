
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamdrift</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0c0914;
    --bg-card:   rgba(22, 16, 36, 0.78);
    --bg-glass:  rgba(255, 255, 255, 0.03);
    --bdr:       rgba(215, 185, 255, 0.12);
    --bdr-focus: rgba(96, 121, 199, 0.5);
    
    --fg:        #f4efe6;
    --dim:       #9e92bc;
    --acc:       #6079c7;
    --acc-rgb:   96, 121, 199;
    --acd:       #344778;
    --hov:       #7793e8;
    --wine:      #778bd1;
    
    --inbg:      #181028;
    --font-sans: 'Plus Jakarta Sans', sans-serif;
    --font-serif: 'Instrument Serif', Georgia, serif;
    --font-mono: 'JetBrains Mono', monospace;
    
    --radius:    6px;
    --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; scroll-behavior: smooth; }

  body {
    background: radial-gradient(circle at 15% -10%, #2b184e 0%, transparent 45%),
                radial-gradient(circle at 85% 105%, #1f0c2e 0%, transparent 50%), var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    min-height: 100vh;
    padding: 24px 20px 60px;
    letter-spacing: -0.01em;
  }

  .wrap { max-width: 1400px; margin: 0 auto; }

  /* ── Header ── */
  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; margin-bottom: 24px;
    border-bottom: 1px solid var(--bdr); padding-bottom: 16px;
  }
  h1 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 3.2rem;
    line-height: 0.95;
    margin: 0;
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, #f4efe6 20%, #6079c7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-actions {
    display: flex; gap: 10px; align-items: center;
  }

  /* ── Layout Grid ── */
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 1024px) {
    .panels { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--bg-card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--bdr);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(96,121,199,0.3), transparent);
  }

  h2 {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 0.7rem;
    color: var(--acc);
    margin: 20px 0 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2::after {
    content: ''; flex: 1; height: 1px; background: var(--bdr);
  }
  h2:first-child { margin-top: 0; }

  /* ── Collapsible Accordion Dropdowns ── */
  .accordion {
    border: 1px solid rgba(96,121,199,0.3);
    background: rgba(96,121,199,0.03);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    transition: var(--transition);
  }
  .accordion:hover {
    border-color: rgba(96,121,199,0.6);
  }
  .acc-header {
    padding: 10px 14px;
    background: rgba(96,121,199,0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--acc);
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .acc-header span.arrow {
    transition: transform 0.25s ease;
    font-size: 0.8rem;
  }
  .accordion.open .acc-header span.arrow {
    transform: rotate(180deg);
  }
  .acc-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s cubic-bezier(0.16, 1, 0.3, 1), padding 0.3s ease;
    padding: 0 14px;
  }
  .accordion.open .acc-body {
    max-height: 1400px;
    padding: 14px;
  }

  /* ── Drop Zones ── */
  .drop {
    border: 1px dashed var(--bdr);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--dim);
    background: var(--bg-glass);
    transition: var(--transition);
    margin-bottom: 10px;
    min-height: 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
    position: relative;
  }
  .drop:hover, .drop.filled {
    border-color: var(--acc);
    color: var(--fg);
    background: rgba(96,121,199,0.03);
  }
  .drop.over {
    background: rgba(96,121,199,0.08);
    border-color: var(--acc);
    color: var(--acc);
  }
  .drop .fn {
    color: var(--acc);
    font-size: 0.68rem;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Queue list container */
  .queue-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 160px;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .queue-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--inbg);
    border: 1px solid var(--bdr);
    padding: 6px 10px;
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--fg);
  }
  .queue-item .qname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 75%; }
  .queue-item .qrem { color: var(--wine); cursor: pointer; font-weight: 700; padding: 0 4px; }
  .queue-item .qrem:hover { color: #ff6b7b; }

  /* ── Fields & Sliders ── */
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--font-mono); font-size: 0.71rem; color: var(--dim);
    margin-bottom: 5px; cursor: help; user-select: none;
  }
  .val { color: var(--acc); font-size: 0.71rem; font-weight: 500; }

  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 4px;
    background: rgba(215,185,255,0.12); outline: none; cursor: pointer;
    border-radius: 2px; transition: var(--transition);
  }
  input[type=range]:hover { background: rgba(215,185,255,0.22); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--acc); cursor: pointer;
    box-shadow: 0 0 10px rgba(var(--acc-rgb), 0.5);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.25); background: var(--hov); }

  select {
    width: 100%; background: var(--inbg); color: var(--fg);
    border: 1px solid var(--bdr); border-radius: var(--radius);
    font-family: var(--font-mono); font-size: 0.72rem;
    padding: 9px 12px; outline: none; cursor: pointer;
    transition: var(--transition);
  }
  select:focus { border-color: var(--acc); box-shadow: 0 0 0 2px rgba(var(--acc-rgb), 0.15); }

  /* ── Chips ── */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip {
    font-family: var(--font-mono); font-size: 0.68rem; color: var(--dim);
    background: var(--bg-glass); border: 1px solid var(--bdr); border-radius: var(--radius);
    padding: 6px 10px; cursor: pointer; transition: var(--transition);
  }
  .chip.on { color: var(--bg); background: var(--acc); border-color: var(--acc); font-weight: 600; box-shadow: 0 0 12px rgba(var(--acc-rgb), 0.3); }
  .chip:hover:not(.on) { border-color: var(--acd); color: var(--fg); background: rgba(255,255,255,0.05); }
  .chip.f1 { flex: 1; text-align: center; }

  /* ── Canvas & YouTube Style Player Wrapper ── */
  .cvwrap {
    width: 100%; background: #000; border: 1px solid var(--bdr); border-radius: var(--radius);
    display: flex; justify-content: center; align-items: center;
    overflow: hidden; position: relative; min-height: 220px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
  }
  canvas { width: 100%; height: auto; display: block; max-height: 480px; object-fit: contain; }

  /* YouTube style control bar */
  .yt-controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
    padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 6px;
    opacity: 0; transition: opacity 0.25s ease;
  }
  .cvwrap:hover .yt-controls, .yt-controls.active { opacity: 1; }

  /* Timeline Scrub Bar */
  .yt-timeline-container {
    position: relative; width: 100%; height: 16px; display: flex; align-items: center; cursor: pointer;
  }
  .yt-timeline-track {
    position: relative; width: 100%; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; transition: height 0.15s ease;
  }
  .yt-timeline-container:hover .yt-timeline-track { height: 6px; }
  .yt-timeline-loaded {
    position: absolute; top: 0; left: 0; height: 100%; background: rgba(255,255,255,0.4); border-radius: 2px; width: 100%;
  }
  .yt-timeline-progress {
    position: absolute; top: 0; left: 0; height: 100%; background: #ff0000; border-radius: 2px; width: 0%;
  }
  .yt-timeline-scrubber-dot {
    position: absolute; top: 50%; left: 0%; width: 12px; height: 12px; background: #ff0000; border-radius: 50%;
    transform: translate(-50%, -50%) scale(0); transition: transform 0.15s ease; pointer-events: none; box-shadow: 0 0 6px rgba(0,0,0,0.6);
  }
  .yt-timeline-container:hover .yt-timeline-scrubber-dot,
  .yt-timeline-container.active .yt-timeline-scrubber-dot {
    transform: translate(-50%, -50%) scale(1);
  }

  /* Bottom Controls Row */
  .yt-bottom-row {
    display: flex; justify-content: space-between; align-items: center; margin-top: 2px;
  }
  .yt-left-controls, .yt-right-controls {
    display: flex; align-items: center; gap: 12px;
  }
  .yt-btn {
    background: none; border: none; color: #fff; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center;
    opacity: 0.9; transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .yt-btn:hover { opacity: 1; transform: scale(1.1); }
  .yt-btn svg { width: 20px; height: 20px; fill: currentColor; }

  .yt-time-display {
    font-family: var(--font-mono); font-size: 0.72rem; color: #fff; user-select: none;
  }

  /* Volume Slider (Shorter) */
  .yt-vol-wrap {
    display: flex; align-items: center; gap: 6px;
  }
  .yt-vol-slider {
    -webkit-appearance: none; width: 64px; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; outline: none; cursor: pointer;
  }
  .yt-vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; cursor: pointer;
  }

  .qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .qgrid .ql { font-family: var(--font-mono); font-size: 0.68rem; color: var(--dim); display: block; margin-bottom: 4px; }

  /* Transport */
  .tport { display: flex; gap: 8px; margin-top: 16px; }
  .btn {
    font-family: var(--font-mono); font-size: 0.73rem; letter-spacing: 0.5px;
    background: var(--bg-glass); color: var(--fg); border: 1px solid var(--bdr);
    border-radius: var(--radius); padding: 10px 14px; cursor: pointer; flex: 1;
    transition: var(--transition); text-transform: uppercase;
  }
  .btn:hover:not(:disabled) { border-color: var(--acc); color: var(--acc); background: rgba(96,121,199,0.05); }
  .btn.pri { background: var(--acc); color: var(--bg); border-color: var(--acc); font-weight: 700; box-shadow: 0 4px 20px rgba(var(--acc-rgb), 0.35); }
  .btn.pri:hover:not(:disabled) { background: var(--hov); transform: translateY(-1px); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .status { font-family: var(--font-mono); font-size: 0.7rem; color: var(--dim); margin-top: 10px; min-height: 1.3em; }
  .status.act  { color: var(--wine); }
  .status.done { color: var(--acc); }
  
  .dl {
    font-family: var(--font-mono); font-size: 0.74rem;
    color: var(--bg); background: var(--acc); text-align: center;
    border-radius: var(--radius); padding: 10px 14px; margin-top: 8px;
    text-decoration: none; font-weight: 700; display: block;
    box-shadow: 0 4px 20px rgba(var(--acc-rgb), 0.35);
    transition: var(--transition);
  }
  .dl:hover { background: var(--hov); transform: translateY(-1px); }

  .hint { font-family: var(--font-mono); font-size: 0.67rem; color: var(--dim); margin: 6px 0 10px; display: none; }
  .hint span { color: var(--acc); }

  /* Fullscreen Mode Styling */
  .cvwrap:fullscreen {
    background: #000; width: 100vw; height: 100vh; border: none; border-radius: 0;
  }
  .cvwrap:fullscreen canvas {
    max-height: 100vh; width: auto; height: 100vh;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: rgba(96,121,199,0.3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--acc); }
</style>

// ── Default rainy lo-fi visual ──────────────────────────────────────────────

  lamp.addColorStop(1, 'rgba(53,73,125,0)');
  ctx.fillStyle=lamp;ctx.fillRect(410,620,360,350);
  ctx.strokeStyle='#242d49';ctx.lineWidth=12;
  ctx.beginPath();ctx.moveTo(585,910);ctx.lineTo(585,790);ctx.lineTo(650,720);ctx.stroke();
  ctx.fillStyle='#344368';

// ── Loudness Normalization (-14 LUFS) ───────────────────────────────────────
function getNormGain() {
  if (cachedNormGain !== null) return cachedNormGain;
  if (!audioBuf) return 1;
  const target = Math.pow(10, -16/20);
  let sum = 0, n = 0;
  for (let ch = 0; ch < audioBuf.numberOfChannels; ch++) {
    const d = audioBuf.getChannelData(ch);
    for (let i = 0; i < d.length; i++) { sum += d[i]*d[i]; n++; }
  }
  const rms = Math.sqrt(sum/n);
  cachedNormGain = rms > 0.0001 ? Math.min(target/rms, 4) : 1;
  return cachedNormGain;
}

// ── Reverb IR Generation ────────────────────────────────────────────────────
function getRevBuffers() {
  if (cachedRevs && cachedRevs.sr === ac.sampleRate) return cachedRevs;
  cachedRevs = { sr: ac.sampleRate, tail: makeRev(4.2, 2.0, true), room: makeRev(1.8, 2.8, false) };
  return cachedRevs;
}
function makeRev(secs, decay, isTail) {
  const rate = ac.sampleRate, len = Math.floor(rate * secs);
  const buf = ac.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    const erLen = Math.floor(rate * 0.08);
    for (let k = 0; k < 18; k++) {
      const t = Math.floor(Math.pow(Math.random(), 1.5) * erLen);
      if (t < len) d[t] += (Math.random()*2-1) * Math.exp(-t/(rate*0.015)) * 0.7;
    }
    const a = 0.65, b = 1-a; let yn = 0;
    for (let i = 0; i < len; i++) {
      const t = i/len;
      let env = Math.pow(1-t, decay);
      if (isTail) env *= (1 - Math.exp(-t*22));
      yn = a*((Math.random()*2-1)*env) + b*yn;
      d[i] += yn;
    }
  }
  return buf;
}

function makeWaveshaper(amount, n=2048) {
  const c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i/(n-1))*2 - 1, k = 2 + amount*4;
    c[i] = (1-amount)*x + amount*(x*(k+1)/(k+Math.abs(x*(k+1))));
  }
  return c;
}

function getAnalyser() {
  if (!analyser) {
    analyser = ac.createAnalyser();
    analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.82;
    analyser.minDecibels = -85; analyser.maxDecibels = -10;
  }
  return analyser;
}

// ── Audio Graph Builder ─────────────────────────────────────────────────────
function buildGraph(dest, offset = 0) {
  const playRate = +$('spd').value * Math.pow(2, +$('pit').value/12);
  const revs = getRevBuffers();
  const width = +$('sw').value;

  const src = ac.createBufferSource();
  src.buffer = audioBuf; src.playbackRate.value = playRate;

  const flutterGain = ac.createGain(); flutterGain.gain.value = 1.0;
  const lfo = ac.createOscillator(); lfo.frequency.value = +$('fltr').value;
  const lfoDepth = ac.createGain(); lfoDepth.gain.value = 0.008 * (+$('wt').value + 0.1);
  lfo.connect(lfoDepth); lfoDepth.connect(src.playbackRate); lfo.start(0);

  const normGain = ac.createGain(); normGain.gain.value = getNormGain();
  const dcb = ac.createBiquadFilter(); dcb.type = 'highpass'; dcb.frequency.value = 20;

  const preEmph = ac.createBiquadFilter(); preEmph.type = 'highshelf'; preEmph.frequency.value = 3000; preEmph.gain.value = 6;
  const shaper = ac.createWaveShaper(); shaper.curve = makeWaveshaper(+$('wt').value); shaper.oversample = '4x';
  const deEmph = ac.createBiquadFilter(); deEmph.type = 'highshelf'; deEmph.frequency.value = 3000; deEmph.gain.value = -6;

  const tapeRoll = ac.createBiquadFilter(); tapeRoll.type = 'highshelf'; tapeRoll.frequency.value = 14000; tapeRoll.gain.value = -5;
  const bassEQ = ac.createBiquadFilter(); bassEQ.type = 'lowshelf'; bassEQ.frequency.value = 90; bassEQ.gain.value = +$('bs').value;

  const dry = ac.createGain(); dry.gain.value = 0.82;

  const tailConv = ac.createConvolver(); tailConv.buffer = revs.tail;
  const tailGain = ac.createGain(); tailGain.gain.value = +$('tl').value;
  const roomConv = ac.createConvolver(); roomConv.buffer = revs.room;
  const roomGain = ac.createGain(); roomGain.gain.value = +$('rm').value;

  const delay = ac.createDelay(5); delay.delayTime.value = +$('dt').value;
  const delHPF = ac.createBiquadFilter(); delHPF.type = 'highpass'; delHPF.frequency.value = 200;
  const delLPF = ac.createBiquadFilter(); delLPF.type = 'lowpass'; delLPF.frequency.value = 6000;
  const fbGain = ac.createGain(); fbGain.gain.value = Math.min(+$('df').value, 0.88);
  const delWet = ac.createGain(); delWet.gain.value = +$('dm').value;

  const limiter = ac.createDynamicsCompressor();
  limiter.threshold.value = -3; limiter.knee.value = 2;
  limiter.ratio.value = 20; limiter.attack.value = 0.001; limiter.release.value = 0.08;
  const makeup = ac.createGain(); makeup.gain.value = 1.26;

  let out;
  if (Math.abs(width-1) < 0.01) {
    out = makeup;
  } else {
    const sp = ac.createChannelSplitter(2), mg = ac.createChannelMerger(2);
    const gLL = ac.createGain(), gRL = ac.createGain(), gLR = ac.createGain(), gRR = ac.createGain();
    gLL.gain.value = (1+width)/2; gRL.gain.value = (1-width)/2;
    gLR.gain.value = (1-width)/2; gRR.gain.value = (1+width)/2;
    makeup.connect(sp);
    sp.connect(gLL,0); sp.connect(gRL,1); sp.connect(gLR,0); sp.connect(gRR,1);
    gLL.connect(mg,0,0); gRL.connect(mg,0,0);
    gLR.connect(mg,0,1); gRR.connect(mg,0,1);
    out = mg;
  }
  out.connect(dest);
  makeup.connect(getAnalyser());

  src.connect(normGain); normGain.connect(dcb);
  dcb.connect(preEmph); preEmph.connect(shaper); shaper.connect(deEmph);
  deEmph.connect(tapeRoll); tapeRoll.connect(bassEQ);
  bassEQ.connect(dry);
  bassEQ.connect(tailConv); tailConv.connect(tailGain);
  bassEQ.connect(roomConv); roomConv.connect(roomGain);
  bassEQ.connect(delay);
  delay.connect(delHPF); delHPF.connect(delLPF); delHPF.connect(fbGain); fbGain.connect(delay);
  delay.connect(delWet);
  dry.connect(limiter); tailGain.connect(limiter); roomGain.connect(limiter); delWet.connect(limiter);
  limiter.connect(makeup);

  const effectiveDuration = audioBuf.duration / playRate;
  return { src, duration: effectiveDuration, offset, lfo };
}

// ── Grain & Film Damage Generation (Slower & Sparse Vertical Scratches) ─────
const GRAIN_N = 12;
const grainFrames = (() => {
  const frames = [];
  for (let f = 0; f < GRAIN_N; f++) {
    const t = document.createElement('canvas'); t.width = 512; t.height = 512;
    const tc = t.getContext('2d'), d = tc.createImageData(512,512);
    for (let i = 0; i < d.data.length; i+=4) {
      const u = Math.random()||1e-10, v = Math.random();
      const g = Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
      const val = Math.max(0,Math.min(255,128+g*35));
      d.data[i]=d.data[i+1]=d.data[i+2]=val; d.data[i+3]=255;
    }
    tc.putImageData(d,0,0); frames.push(t);
  }
  return frames;
})();

let scanCache=null, vhsBuf=null, vhsCx=null;
function getScanlines(w,h) {
  if (scanCache && scanCache.width===w && scanCache.height===h) return scanCache;
  scanCache = document.createElement('canvas'); scanCache.width=w; scanCache.height=h;
  const sc = scanCache.getContext('2d'); sc.fillStyle='#000';
  for (let y=0;y<h;y+=3) sc.fillRect(0,y,w,1);
  return scanCache;
}
function getVhsBuf(w,h) {
  if (!vhsBuf||vhsBuf.width!==w||vhsBuf.height!==h) {
    vhsBuf=document.createElement('canvas'); vhsBuf.width=w; vhsBuf.height=h;
    vhsCx=vhsBuf.getContext('2d');
  }
  return vhsCx;
}

// ── Canvas Rendering Engine ────────────────────────────────────────────────
function drawFrame(tSec, animate) {
  if (!img) return;
  const w=cv.width, h=cv.height;
  const grA=+$('gr').value, dmgA=+$('dmg').value, vhA=+$('vh').value, scA=+$('sc').value;
  const chA=+$('ch').value, viA=+$('vi').value, flA=+$('fl').value;
  const spA=+$('sp').value;

  cx.save();
  cx.clearRect(0,0,w,h);
  const zoom = 1+(animate?Math.min(tSec/50,1):0)*0.05;
  cx.translate(w/2,h/2); cx.scale(zoom,zoom); cx.translate(-w/2,-h/2);

  if (colorPre === 'warm') {
    cx.filter = 'sepia(0.38) saturate(1.22) contrast(1.06) brightness(0.96) hue-rotate(-5deg)';
  } else if (colorPre === 'film') {
    cx.filter = 'grayscale(0.6) contrast(1.15) brightness(0.88) saturate(0.85)';
  } else if (colorPre === 'golden') {
    cx.filter = 'sepia(0.55) saturate(1.35) contrast(1.1) brightness(1.02) hue-rotate(-12deg)';
  } else {
    cx.filter = 'none';
  }
  cover(w,h);
  cx.filter='none';

  if (chA>0) {
    const px=Math.round(chA*10);
    cx.globalAlpha=chA*0.5; cx.globalCompositeOperation='screen';
    cx.filter='saturate(3.5) hue-rotate(-15deg) brightness(.6)'; cover(w,h,-px,0);
    cx.filter='saturate(3.5) hue-rotate(200deg) brightness(.6)'; cover(w,h,px,0);
    cx.filter='none';
    cx.globalCompositeOperation='source-over'; cx.globalAlpha=1;
  }

  cx.restore();

  if (viA>0) {
    const vg=cx.createRadialGradient(w/2,h/2,h*.3,w/2,h/2,Math.max(w,h)*.7);
    const a=colorPre==='golden'?viA*0.6:viA*0.7;
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,colorPre==='golden'?`rgba(8,13,30,${a})`:`rgba(0,0,0,${a})`);
    cx.fillStyle=vg; cx.fillRect(0,0,w,h);
  }
  if (grA>0) {
    const frame=grainFrames[animate?(Math.floor(tSec*12)%GRAIN_N):0];
    const ox=(Math.random()*512)|0, oy=(Math.random()*512)|0;
    cx.globalAlpha=grA*0.28; cx.globalCompositeOperation='overlay';
    for(let x=-ox;x<w;x+=512) for(let y=-oy;y<h;y+=512) cx.drawImage(frame,x,y);
    cx.globalCompositeOperation='source-over'; cx.globalAlpha=1;
  }

  // Slower, Sparse Vertical Film Scratches / Lines Only
  if (dmgA > 0 && animate) {
    cx.save();
    cx.globalAlpha = dmgA * 0.45;
    cx.strokeStyle = 'rgba(255, 255, 250, 0.4)';
    cx.lineWidth = 1.2;
    // Pseudo-random but temporally coherent slow-moving vertical lines
    const seed = Math.floor(tSec * 1.5);
    for (let i = 0; i < 2; i++) {
      const rx = (Math.sin(seed + i * 99) * 0.5 + 0.5) * w;
      cx.beginPath();
      cx.moveTo(rx, 0);
      cx.lineTo(rx + (Math.random() - 0.5) * 4, h);
      cx.stroke();
    }
    cx.restore();
  }

  if (scA>0) { cx.globalAlpha=scA*0.32; cx.drawImage(getScanlines(w,h),0,0); cx.globalAlpha=1; }
  if (vhA>0&&animate) {
    const vc=getVhsBuf(w,h); vc.drawImage(cv,0,0);
    const bands=Math.ceil(vhA*6);
    for(let i=0;i<bands;i++) {
      if(Math.random()<vhA*0.2) {
        const gy=(Math.random()*h)|0, gh=(Math.random()*5+1)|0;
        cx.drawImage(vhsBuf,0,gy,w,gh,(Math.random()-.5)*vhA*16,gy,w,gh);
      }
    }
  }
  if (animate&&flA>0) {
    const fl=(Math.sin(tSec*11)+Math.sin(tSec*6.2))*0.012*flA;
    if (fl>0) { cx.fillStyle=`rgba(255,255,255,${fl})`; cx.fillRect(0,0,w,h); }
    else       { cx.fillStyle=`rgba(0,0,0,${-fl})`; cx.fillRect(0,0,w,h); }
  }
  if (spA>0&&analyser) {
    const bins=analyser.frequencyBinCount;
    if(!specBuf||specBuf.length!==bins) specBuf=new Uint8Array(bins);
    analyser.getByteFrequencyData(specBuf);
    const barH=h*0.16, barW=w/bins;
    cx.fillStyle=`rgba(0,0,0,${spA*0.4})`; cx.fillRect(0,h-barH,w,barH);
    for(let i=0;i<bins;i++){
      const v=specBuf[i]/255; if(v<0.01) continue;
      const bh=v*barH, alpha=spA*(0.5+v*0.5);
      cx.fillStyle=`hsla(${28+v*18},85%,62%,${alpha})`;
      cx.fillRect(i*barW, h-bh, Math.max(barW-1,1), bh);
    }
  }
}
function cover(w,h,ox=0,oy=0) {
  const ir=img.width/img.height, cr=w/h;
  const dw=ir>cr?h*ir:w, dh=ir>cr?h:w/ir;
  cx.drawImage(img,(w-dw)/2+ox,(h-dh)/2+oy,dw,dh);
}

const playIconHtml = `<path d="M8 5v14l11-7z"/>`;

const muteIconHtml = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;

function seekToTime(tSec) {
  if (!audioBuf) return;
  tSec = Math.max(0, Math.min(tSec, totalDuration));
  const playRate = +$('spd').value * Math.pow(2, +$('pit').value/12);
  playbackOffset = Math.min(tSec * playRate, Math.max(0, audioBuf.duration - 0.001));
  curTimeDisp.textContent = fmtT(tSec);
  const pctVal = (tSec / totalDuration) * 100;
  ytProgBar.style.width = pctVal + '%';
  ytDot.style.left = pctVal + '%';
  drawFrame(tSec, false);

  if (previewing && ac) {
    startPreviewGraph(playbackOffset);
    previewStartTime = ac.currentTime - tSec;
  }
}

  const ratio = clickX / rect.width;
  seekToTime(ratio * totalDuration);
}

// ── Preview Player Loop ─────────────────────────────────────────────────────
function disposePreviewGraph() {
  if (prvSrc) { try { prvSrc.stop(); } catch {} prvSrc = null; }
  if (previewLfo) { try { previewLfo.stop(); } catch {} previewLfo = null; }
  if (previewGain) { try { previewGain.disconnect(); } catch {} previewGain = null; }
}

function startPreviewGraph(offset) {
  disposePreviewGraph();
  previewGain = ac.createGain();
  previewGain.gain.setValueAtTime(+$('ytVol').value, ac.currentTime);
  previewGain.connect(ac.destination);
  const graph = buildGraph(previewGain, offset);
  graph.src.start(0, offset);
  prvSrc = graph.src;
  previewLfo = graph.lfo;
}

async function togglePreview() {
  if (previewing) {
    const playRate = +$('spd').value * Math.pow(2, +$('pit').value/12);
    const pausedAt = Math.max(0, Math.min(ac.currentTime - previewStartTime, totalDuration));
    playbackOffset = Math.min(pausedAt * playRate, Math.max(0, audioBuf.duration - 0.001));
    curTimeDisp.textContent = fmtT(pausedAt);
    stopPreview();
    return;
  }
  if (!audioBuf || !img) return;
  const request = ++previewRequest;
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  await ac.resume();
  if (request !== previewRequest || recording) return;

  previewing = true;
  $('playIcon').innerHTML = pauseIconHtml;
  prvBtn.textContent = '■ stop';

  const playRate = +$('spd').value * Math.pow(2, +$('pit').value/12);
  startPreviewGraph(playbackOffset);
  
  setStatus('previewing — normalized to −14 LUFS.', 'act');
  previewStartTime = ac.currentTime - ((playbackOffset / audioBuf.duration) * totalDuration);

  (function loop() {
    if (!previewing || request !== previewRequest) return;
    const t = ac.currentTime - previewStartTime;

    if (t >= totalDuration) {
      playbackOffset = 0;
      stopPreview();
      seekToTime(0);
      setStatus('preview finished.', 'done');
      return;
    }

    if (!isDraggingTimeline) {
      curTimeDisp.textContent = fmtT(t);
      const pctVal = (t / totalDuration) * 100;
      ytProgBar.style.width = pctVal + '%';
      ytDot.style.left = pctVal + '%';
    }

    drawFrame(t, true);
    animId = requestAnimationFrame(loop);
  })();
}

function stopPreview() {
  previewRequest++;
  previewing = false;
  cancelAnimationFrame(animId);
  disposePreviewGraph();
  $('playIcon').innerHTML = playIconHtml;
  prvBtn.textContent = 'preview';
  setStatus('stopped.');
}

// ── Single File Drop Handling ───────────────────────────────────────────────
function renderQueueUI() {
  queueList.innerHTML = '';
  queue.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'queue-item' + (idx === currentQueueIndex ? ' active' : '');
    div.innerHTML = `<span class="qname">${item.name}</span><span class="qrem" data-idx="${idx}">×</span>`;
    queueList.appendChild(div);
  });

  queueList.querySelectorAll('.qrem').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const idx = +btn.dataset.idx;
      queue.splice(idx, 1);
      currentQueueIndex = 0;
      audioBuf = null;
      playbackOffset = 0;
      $('aName').textContent = '';
      $('aDrop').classList.remove('filled');
      renderQueueUI();
      enable();
    });
  });
}

function bindDrop(zoneId, inputId) {
  const zone = $(zoneId), input = $(inputId);
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('over');
    const file = Array.from(e.dataTransfer.files).find(f =>
      f.type.startsWith('audio/') || f.type.startsWith('video/')
    );
    if (!file) return;
    const dt = new DataTransfer();
    dt.items.add(file);
    input.files = dt.files;
    input.dispatchEvent(new Event('change'));
  });
}

bindDrop('aDrop', 'aIn');
bindDrop('iDrop', 'iIn');

$('aIn').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  await ac.resume();

  setStatus('decoding ' + file.name + '…', 'act');
  try {
    let buf = null;
    try {
      buf = await ac.decodeAudioData(await file.arrayBuffer());
    } catch {
      buf = await extractViaEl(file);
    }
    if (!buf) throw new Error('No audio track could be decoded.');
    stopPreview();
    queue = [{ file, name: file.name, buffer: buf }];
    currentQueueIndex = 0;
    audioBuf = buf;
    playbackOffset = 0;
    $('aName').textContent = file.name;
    $('aDrop').classList.add('filled');
  } catch (err) {
    queue = [];
    audioBuf = null;
    setStatus('This file could not be decoded.', 'act');
    console.warn('Failed to decode', file.name, err);
  }

  renderQueueUI();
  cachedRevs = null; cachedNormGain = null; analyser = null;
  enable();
  if (audioBuf) {
    seekToTime(0);
    setStatus('ready to preview or export.', 'done');
    window.prepareFFmpeg?.().catch(() => {});
  }
  e.target.value = '';
});

$('iIn').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  $('iName').textContent = file.name; $('iDrop').classList.add('filled');
  const url = URL.createObjectURL(file);
  const image = new Image();
  image.onload = () => { URL.revokeObjectURL(url); img = image; drawFrame(0, false); enable(); };
  image.src = url;
});

function extractViaEl(file) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('video');
    const url = URL.createObjectURL(file);
    el.src = url; el.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:1px;height:1px';
    document.body.appendChild(el);

    let rec, guard, metaGuard, speed = 1;
    const chunks = [];
    const cleanup = () => {
      clearTimeout(guard); clearTimeout(metaGuard);
      try { document.body.removeChild(el); } catch {}
      URL.revokeObjectURL(url);
    };
    const fail = msg => {
      if (rec && rec.state !== 'inactive') try { rec.stop(); } catch {}
      cleanup(); reject(new Error(msg));
    };

    el.onerror = () => fail('media error');
    metaGuard = setTimeout(() => fail('timed out'), 12000);

    el.onloadedmetadata = () => {
      clearTimeout(metaGuard);
      try {
        const mediaSrc = ac.createMediaElementSource(el);
        const dst = ac.createMediaStreamDestination();
        mediaSrc.connect(dst);
        const mute = ac.createGain(); mute.gain.value = 0;
        mediaSrc.connect(mute); mute.connect(ac.destination);

        el.playbackRate = 8; speed = Math.max(1, el.playbackRate || 1);
        const mime = ['audio/webm;codecs=opus','audio/webm','audio/ogg'].find(m => MediaRecorder.isTypeSupported(m)) || '';
        rec = new MediaRecorder(dst.stream, mime ? {mimeType:mime} : {});
        rec.ondataavailable = ev => { if(ev.data.size) chunks.push(ev.data); };
        rec.onstop = () => {
          cleanup();
          const blob = new Blob(chunks, {type:mime||'audio/webm'});
          blob.arrayBuffer().then(ab => ac.decodeAudioData(ab)).then(resolve).catch(()=>reject(new Error('decode failed')));
        };
        rec.start(200);
        el.onended = () => { if(rec.state==='recording') rec.stop(); };
        guard = setTimeout(() => { if(rec&&rec.state==='recording') rec.stop(); }, ((el.duration||600)/speed+15)*1000);
        el.play().catch(err => fail(err.message));
      } catch(err){fail(err.message);}
    };
    el.load();
  });
}

function enable() {
  const ok = !!audioBuf;
  prvBtn.disabled = !ok; expBtn.disabled = !ok;
  if(ok){setStatus('ready to preview or export.');updateHint();}
}

// ── Single-file Export Engine ───────────────────────────────────────────────
async function renderSingleFile(buf) {
  if (!window.MediaRecorder) throw new Error('Video export is not supported in this browser.');
  if (typeof cv.captureStream !== 'function') throw new Error('Canvas recording is not supported in this browser.');

  const prevBuf = audioBuf; audioBuf = buf; cachedNormGain = null;
  const playRate = +$('spd').value * Math.pow(2, +$('pit').value/12);
  const effectiveDuration = audioBuf.duration / playRate;

  const streamDst = ac.createMediaStreamDestination();
  const graphResult = buildGraph(streamDst, 0);
  const fps = +$('fps').value;
  const canvasStream = cv.captureStream(fps);
  const mixed = new MediaStream([...canvasStream.getVideoTracks(), ...streamDst.stream.getAudioTracks()]);

  // Prefer MP4, then use the broadly-supported WebM recorder path. Keeping the
  // real container extension is essential; renaming WebM to MP4 corrupts it.
  const candidates = [
    'video/webm;codecs=vp8,opus',
    'video/webm;codecs=vp9,opus',
    'video/webm',
    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
    'video/mp4',
  ];
  const mime = candidates.find(type => MediaRecorder.isTypeSupported(type));
  if (!mime) {
    mixed.getTracks().forEach(track => track.stop());
    audioBuf = prevBuf;
    throw new Error('This browser does not support video recording.');
  }

  let recorder;
  const isIntermediateWebM = mime.includes('webm');
  const options = {
    mimeType: mime,
    videoBitsPerSecond: Math.min(
      +$('vb').value * 1_000_000,
      isIntermediateWebM ? 8_000_000 : Number.POSITIVE_INFINITY
    ),
    audioBitsPerSecond: Math.min(
      +$('ab').value * 1_000,
      isIntermediateWebM ? 192_000 : Number.POSITIVE_INFINITY
    ),
  };
  try {
    recorder = new MediaRecorder(mixed, options);
  } catch {
    try {
      recorder = new MediaRecorder(mixed, { mimeType: mime });
    } catch (error) {
      mixed.getTracks().forEach(track => track.stop());
      try { graphResult.lfo.stop(); } catch {}
      audioBuf = prevBuf;
      throw error;
    }
  }
  const actualMime = recorder.mimeType || mime;
  const outputExtension = actualMime.includes('mp4') ? 'mp4' : 'webm';

  return new Promise((resolve, reject) => {
    const chunks = [];
    let frameRequest = 0, stopTimer = 0, safetyTimer = 0, settled = false;
    const cleanup = () => {
      cancelAnimationFrame(frameRequest);
      clearTimeout(stopTimer);
      clearTimeout(safetyTimer);
      try { graphResult.src.stop(); } catch {}
      try { graphResult.lfo.stop(); } catch {}
      mixed.getTracks().forEach(track => track.stop());
      audioBuf = prevBuf;
    };
    const fail = error => {
      if (settled) return;
      settled = true;
      try { if (recorder.state !== 'inactive') recorder.stop(); } catch {}
      cleanup();
      reject(error instanceof Error ? error : new Error('Export failed.'));
    };
    const stopRecorder = () => {
      if (recorder.state === 'recording') recorder.stop();
    };

    recorder.ondataavailable = ev => { if(ev.data.size) chunks.push(ev.data); };
    recorder.onstop = () => {
      if (settled) return;
      settled = true;
      const ext = outputExtension;
      const blob = new Blob(chunks, { type: actualMime });
      cleanup();
      if (!blob.size) {
        reject(new Error('The browser produced an empty recording.'));
        return;
      }
      resolve({ blob, ext, duration: effectiveDuration });
    };
    recorder.onerror = event => fail(event.error || new Error('MediaRecorder failed.'));

    const t0 = ac.currentTime;
    graphResult.src.onended = () => { stopTimer = setTimeout(stopRecorder, 1400); };
    try {
      recorder.start(500);
      graphResult.src.start(0);
    } catch (error) {
      fail(error);
      return;
    }
    safetyTimer = setTimeout(stopRecorder, Math.ceil((effectiveDuration + 8) * 1000));
    let lastProgress = -1;
    const renderExportFrame = () => {
      if (recorder.state === 'inactive') return;
      const t = Math.max(0, ac.currentTime - t0);
      drawFrame(t, true);
      const progress = Math.min(99, Math.floor((t / effectiveDuration) * 100));
      if (progress >= lastProgress + 2) {
        lastProgress = progress;
        expBtn.textContent = `exporting ${progress}%`;
      }
      frameRequest = requestAnimationFrame(renderExportFrame);
    };
    renderExportFrame();
  });
}

expBtn.addEventListener('click', async () => {
  if (recording || !audioBuf) return;
  recording = true;
  expBtn.disabled = true;
  prvBtn.disabled = true;
  expBtn.textContent = 'exporting…';
  dlLink.style.display = 'none';
  try {
    if(!ac) ac = new(window.AudioContext||window.webkitAudioContext)();
    await ac.resume();
    stopPreview();
    setStatus('rendering video…', 'act');
    const recorded = await renderSingleFile(audioBuf);
    let blob = recorded.blob;
    let ext = recorded.ext;
    if (ext !== 'mp4') {
      if (!window.transcodeToMp4) throw new Error('MP4 converter failed to load.');
      expBtn.textContent = 'loading MP4 converter…';
      blob = await window.transcodeToMp4(blob, recorded.duration, progress => {
        expBtn.textContent = `converting MP4 ${Math.round(progress * 100)}%`;
      });
      ext = 'mp4';
    }
    if (exportUrl) URL.revokeObjectURL(exportUrl);
    exportUrl = URL.createObjectURL(blob);
    const sourceName = queue[0]?.name || 'dreamdrift';
    const baseName = sourceName.replace(/\.[^/.]+$/, '');
    dlLink.href = exportUrl;
    dlLink.download = baseName + '-dreamdrift.' + ext;
    dlLink.textContent = 'download ' + dlLink.download;
    dlLink.style.display = 'inline-flex';
    setStatus('export ready for download.', 'done');
    // The original export click is a user gesture; browsers permit this
    // follow-up download while the visible link remains as a fallback.
    dlLink.click();
  } catch (error) {
    console.error('Export failed', error);
    setStatus(error.message || 'Export failed.', 'act');
    expBtn.textContent = 'export failed — retry';
    return;
  } finally {
    recording = false;
    expBtn.disabled = false;
    prvBtn.disabled = false;
  }
  expBtn.textContent = 'export current';
});

// Settings Persistence
const LS_KEY = 'tape-room-v8';
function saveSettings() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      spd:$('spd').value,pit:$('pit').value,tl:$('tl').value,rm:$('rm').value,
      wt:$('wt').value,fltr:$('fltr').value,bs:$('bs').value,sw:$('sw').value,
      dt:$('dt').value,df:$('df').value,dm:$('dm').value,
      gr:$('gr').value,dmg:$('dmg').value,vh:$('vh').value,sc:$('sc').value,
      ch:$('ch').value,vi:$('vi').value,fl:$('fl').value,sp:$('sp').value,
      vb:$('vb').value,ab:$('ab').value,fps:$('fps').value,
      res:$('res').value,ar:$('ar').value,color:colorPre,
    }));
  } catch {}
}
function loadSettings() {
  try {
    const s=JSON.parse(localStorage.getItem(LS_KEY)); if(!s) return;
    const set=(id,val)=>{if(val!==undefined&&$(id))$(id).value=val;};
    set('spd',s.spd);set('pit',s.pit);set('tl',s.tl);set('rm',s.rm);
    set('wt',s.wt);set('fltr',s.fltr);set('bs',s.bs);set('sw',s.sw);
    set('dt',s.dt);set('df',s.df);set('dm',s.dm);
    set('gr',s.gr);set('dmg',s.dmg);set('vh',s.vh);set('sc',s.sc);
    set('ch',s.ch);set('vi',s.vi);set('fl',s.fl);set('sp',s.sp);
    set('vb',s.vb);set('ab',s.ab);set('fps',s.fps);
    set('res',s.res);set('ar',s.ar);
    if(s.color){colorPre=s.color;document.querySelectorAll('[data-vp]').forEach(b=>b.classList.toggle('on',b.dataset.vp===colorPre));}
  } catch {}
}


// ── Initialization ──────────────────────────────────────────────────────────
loadSettings();
initDefaultImage();
applyDims();
refreshLabels();

})();
</script>
